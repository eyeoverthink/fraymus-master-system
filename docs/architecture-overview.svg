  <text x="52" y="310" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">v13 Signing</text>
  <rect x="156" y="288" width="100" height="34" rx="6" fill="#2563eb" filter="url(#shadow)"/>
  <text x="170" y="310" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hub Relay</text>
  <rect x="270" y="288" width="106" height="34" rx="6" fill="#2563eb" filter="url(#shadow)"/>
  <text x="278" y="310" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Mesh Entity</text>
  <rect x="390" y="288" width="100" height="34" rx="6" fill="#2563eb" filter="url(#shadow)"/>
  <text x="403" y="310" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hive Mind</text>
  <rect x="504" y="288" width="120" height="34" rx="6" fill="#1d4ed8" filter="url(#shadow)"/>
  <text x="510" y="310" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Kuramoto Sync</text>

