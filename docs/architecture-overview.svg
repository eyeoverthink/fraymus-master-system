  <rect x="30" y="350" width="640" height="80" rx="8" fill="#7c3aed" opacity="0.15"/>
  <text x="42" y="370" fill="#c4b5fd" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LAYER 1b — MULTI-FORMAT ENCODING</text>
  <rect x="42" y="378" width="130" height="34" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="47" y="400" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Emoji (vis + stego)</text>
  <rect x="186" y="378" width="140" height="34" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="191" y="400" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">DNA (ACGT + HDC)</text>
  <rect x="340" y="378" width="135" height="34" rx="6" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="345" y="400" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">WASM (5-section)</text>
  <rect x="489" y="378" width="80" height="34" rx="6" fill="#6d28d9" filter="url(#shadow)"/>
  <text x="497" y="400" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Merkle</text>
  <rect x="583" y="378" width="75" height="34" rx="6" fill="#6d28d9" filter="url(#shadow)"/>
  <text x="605" y="400" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">ZIP</text>

  <!-- ═══ Layer 1: Core Primitives ═══ -->
  <rect x="30" y="440" width="640" height="80" rx="8" fill="#0d9488" opacity="0.15"/>
  <text x="42" y="460" fill="#5eead4" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LAYER 1 — CORE CRYPTOGRAPHIC PRIMITIVES</text>
  <rect x="42" y="468" width="145" height="34" rx="6" fill="#0d9488" filter="url(#shadow)"/>
  <text x="47" y="490" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">SHA-256 (async+sync)</text>
  <rect x="201" y="468" width="170" height="34" rx="6" fill="#0d9488" filter="url(#shadow)"/>
  <text x="206" y="490" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Ed25519 (Crypto+BigInt)</text>
  <rect x="385" y="468" width="115" height="34" rx="6" fill="#0d9488" filter="url(#shadow)"/>
  <text x="393" y="490" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">FNV-1a / CRC32</text>
  <rect x="514" y="468" width="148" height="34" rx="6" fill="#0d9488" filter="url(#shadow)"/>
  <text x="522" y="490" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600">Canonical / Base64</text>

  <!-- ═══ Data Model (right column) ═══ -->
  <rect x="690" y="60" width="190" height="460" rx="8" fill="#475569" opacity="0.2"/>
  <text x="720" y="85" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">DATA MODEL</text>

  <rect x="705" y="100" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="722" y="122" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">43 Entity Schemas</text>
  <text x="727" y="140" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">6 categories across 5 apps</text>

  <rect x="705" y="165" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="730" y="187" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">12 Workflows</text>
  <text x="714" y="205" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">7 event + 4 scheduled + 1 ext</text>

  <rect x="705" y="230" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="738" y="252" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">5 MCP Tools</text>
  <text x="718" y="270" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">External agent integration</text>

  <rect x="705" y="300" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="730" y="322" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">9 AI Agents</text>
  <text x="712" y="340" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Multi-model fleet roster</text>

  <rect x="705" y="370" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="726" y="392" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">4 Compute Nodes</text>
  <text x="710" y="410" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Cloud · GPU · VPS · GitHub</text>

  <rect x="705" y="440" width="160" height="50" rx="6" fill="#475569" filter="url(#shadow)"/>
  <text x="726" y="462" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">3 Trust Zones</text>
  <text x="720" y="480" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">SIGN · RUN · DEPLOY</text>

  <!-- Vertical connection arrows between layers -->
  <line x1="350" y1="130" x2="350" y2="140" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="350" y1="250" x2="350" y2="260" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="350" y1="340" x2="350" y2="350" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="350" y1="430" x2="350" y2="440" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Horizontal connection to Data Model -->
  <line x1="670" y1="200" x2="690" y2="200" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="670" y1="310" x2="690" y2="310" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="670" y1="400" x2="690" y2="400" stroke="#475569" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Footer -->
  <text x="350" y="545" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" text-anchor="middle">30 files · 2,225 lines · 8 modules · Zero external dependencies</text>
  <text x="350" y="565" fill="#475569" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">Consolidated from 5 Base44 apps: Library Manager · Transmuter · Creator Nexus · FrayForge · Castify</text>

  <!-- FRAY seal glyph bottom-right -->
  <text x="830" y="580" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="28">🔱</text>
</svg>
