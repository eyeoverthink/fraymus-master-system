<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" rx="12" fill="#1a1b2e"/>

  <!-- Title -->
  <text x="330" y="38" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="700">FRAYMUS Master System Architecture</text>
  <line x1="80" y1="50" x2="820" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- ═══ Layer 4 (top): Bridge & Continuity ═══ -->
  <rect x="30" y="60" width="640" height="70" rx="8" fill="#059669" opacity="0.18"/>
  <text x="42" y="80" fill="#6ee7b7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LAYER 4 — BRIDGE &amp; CONTINUITY</text>
  <rect x="42" y="88" width="200" height="34" rx="6" fill="#059669" filter="url(#shadow)"/>
  <text x="92" y="110" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Orifice Bridge</text>
  <rect x="260" y="88" width="200" height="34" rx="6" fill="#059669" filter="url(#shadow)"/>
  <text x="296" y="110" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600">Cross-Tab Memory</text>

  <!-- ═══ Layer 3: Intelligence ═══ -->
  <rect x="30" y="140" width="640" height="110" rx="8" fill="#d97706" opacity="0.15"/>
  <text x="42" y="160" fill="#fbbf24" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">LAYER 3 — INTELLIGENCE &amp; EVOLUTION</text>
  <rect x="42" y="168" width="140" height="34" rx="6" fill="#d97706" filter="url(#shadow)"/>
  <text x="62" y="190" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Ouroboros RSI</text>
  <rect x="196" y="168" width="160" height="34" rx="6" fill="#d97706" filter="url(#shadow)"/>
  <text x="206" y="190" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Hermes 30-Skill Fleet</text>
  <rect x="370" y="168" width="148" height="34" rx="6" fill="#d97706" filter="url(#shadow)"/>
  <text x="388" y="190" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Motor Dispatcher</text>
  <rect x="532" y="168" width="130" height="34" rx="6" fill="#d97706" filter="url(#shadow)"/>
  <text x="537" y="190" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">OpenClaw Gateway</text>
  <rect x="42" y="210" width="130" height="34" rx="6" fill="#b45309" filter="url(#shadow)"/>
  <text x="60" y="232" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Control Plane</text>
  <rect x="186" y="210" width="130" height="34" rx="6" fill="#b45309" filter="url(#shadow)"/>
  <text x="204" y="232" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Needle Queue</text>
  <rect x="330" y="210" width="140" height="34" rx="6" fill="#b45309" filter="url(#shadow)"/>
  <text x="351" y="232" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Niles FRAYVM</text>

