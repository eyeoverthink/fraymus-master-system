<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="ds" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" rx="12" fill="#1a1b2e"/>

  <!-- Title -->
  <text x="350" y="30" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700">Data Flow Through the FRAYMUS System</text>
  <line x1="60" y1="42" x2="840" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- ═══ Stage 1: Identity ═══ -->
  <rect x="20" y="60" width="120" height="100" rx="8" fill="#0d9488" filter="url(#ds)"/>
  <text x="38" y="82" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">1. IDENTITY</text>
  <line x1="30" y1="88" x2="130" y2="88" stroke="#5eead4" stroke-width="0.5" opacity="0.5"/>
  <text x="35" y="105" fill="#ccfbf1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Ed25519 keygen</text>
  <text x="35" y="120" fill="#ccfbf1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">SHA-256(pubkey)</text>
  <text x="35" y="135" fill="#5eead4" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">→ fx-XXXX-XXXX</text>
  <text x="35" y="150" fill="#ccfbf1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Web Crypto | BigInt</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="110" x2="160" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ Stage 2: Message Signing ═══ -->
  <rect x="165" y="60" width="120" height="100" rx="8" fill="#2563eb" filter="url(#ds)"/>
  <text x="175" y="82" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">2. SIGNING</text>
  <line x1="175" y1="88" x2="275" y2="88" stroke="#93c5fd" stroke-width="0.5" opacity="0.5"/>
  <text x="175" y="105" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">v13 protocol</text>
  <text x="175" y="120" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Hash chain (prev)</text>
  <text x="175" y="135" fill="#93c5fd" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">±300s window</text>
  <text x="175" y="150" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Canonical JSON</text>

  <!-- Arrow 2→3 -->
  <line x1="285" y1="110" x2="305" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ Stage 3: Encoding ═══ -->
  <rect x="310" y="52" width="130" height="118" rx="8" fill="#7c3aed" filter="url(#ds)"/>
  <text x="320" y="74" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">3. ENCODING</text>
  <line x1="320" y1="80" x2="430" y2="80" stroke="#c4b5fd" stroke-width="0.5" opacity="0.5"/>
  <text x="320" y="96" fill="#ede9fe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">→ SHA-256 hash</text>
  <text x="320" y="110" fill="#ede9fe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">→ Emoji (vis/stego)</text>
  <text x="320" y="124" fill="#ede9fe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">→ DNA (ACGT+HDC)</text>
  <text x="320" y="138" fill="#ede9fe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">→ Merkle / FRAY</text>
  <text x="320" y="152" fill="#ede9fe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">→ WASM / ZIP</text>
  <text x="320" y="165" fill="#c4b5fd" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="600">allForms() → 7 outputs</text>

  <!-- Arrow 3→4 -->
  <line x1="440" y1="110" x2="460" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ Stage 4: Transport ═══ -->
  <rect x="465" y="60" width="120" height="100" rx="8" fill="#2563eb" filter="url(#ds)"/>
  <text x="475" y="82" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">4. TRANSPORT</text>
  <line x1="475" y1="88" x2="575" y2="88" stroke="#93c5fd" stroke-width="0.5" opacity="0.5"/>
  <text x="475" y="105" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Hub Relay (VPS)</text>
  <text x="475" y="120" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Mesh Entity</text>
  <text x="475" y="135" fill="#93c5fd" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Hive Mind</text>
  <text x="475" y="150" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Kuramoto sync</text>

  <!-- Arrow 4→5 -->
  <line x1="585" y1="110" x2="605" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ Stage 5: Intelligence ═══ -->
  <rect x="610" y="60" width="130" height="100" rx="8" fill="#d97706" filter="url(#ds)"/>
  <text x="618" y="82" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">5. INTELLIGENCE</text>
  <line x1="620" y1="88" x2="730" y2="88" stroke="#fbbf24" stroke-width="0.5" opacity="0.5"/>
  <text x="620" y="105" fill="#fef3c7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">OpenClaw routes →</text>
  <text x="620" y="120" fill="#fef3c7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">  Hermes (30 skills)</text>
  <text x="620" y="135" fill="#fef3c7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">  Motor (dispatch)</text>
  <text x="620" y="150" fill="#fbbf24" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">  Ouroboros (RSI)</text>

  <!-- Arrow 5→6 -->
  <line x1="740" y1="110" x2="760" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ═══ Stage 6: Bridge ═══ -->
  <rect x="765" y="60" width="120" height="100" rx="8" fill="#059669" filter="url(#ds)"/>
  <text x="790" y="82" fill="#fff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">6. BRIDGE</text>
  <line x1="775" y1="88" x2="875" y2="88" stroke="#6ee7b7" stroke-width="0.5" opacity="0.5"/>
  <text x="775" y="105" fill="#d1fae5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Orifice captures</text>
  <text x="775" y="120" fill="#d1fae5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">continuity entry</text>
  <text x="775" y="135" fill="#6ee7b7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600">Cross-Tab sync</text>
  <text x="775" y="150" fill="#d1fae5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">BroadcastChannel</text>

  <!-- ═══ Bottom detail row: Compute Nodes ═══ -->
  <text x="40" y="210" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">COMPUTE NODES</text>
  <line x1="40" y1="218" x2="860" y2="218" stroke="#334155" stroke-width="0.5"/>

  <rect x="40" y="228" width="190" height="52" rx="6" fill="#334155" filter="url(#ds)"/>
  <text x="55" y="250" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Base44 Cloud</text>
  <text x="55" y="268" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Entity CRUD · Workflows · Web UI</text>

  <rect x="250" y="228" width="190" height="52" rx="6" fill="#334155" filter="url(#ds)"/>
  <text x="265" y="250" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">Windows GPU (RTX)</text>
  <text x="265" y="268" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Ollama inference · Heavy compute</text>

  <rect x="460" y="228" width="190" height="52" rx="6" fill="#334155" filter="url(#ds)"/>
  <text x="475" y="250" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">VPS (Hostinger)</text>
  <text x="475" y="268" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Hub relay · Model compilation</text>

  <rect x="670" y="228" width="190" height="52" rx="6" fill="#334155" filter="url(#ds)"/>
  <text x="685" y="250" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">GitHub</text>
  <text x="685" y="268" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Repository ops · CI/CD</text>

  <!-- ═══ Bottom detail row: Trust Zones ═══ -->
  <text x="40" y="310" fill="#94a3b8" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">TRUST ZONES</text>
  <line x1="40" y1="318" x2="860" y2="318" stroke="#334155" stroke-width="0.5"/>

  <rect x="40" y="328" width="260" height="46" rx="6" fill="#059669" opacity="0.25"/>
  <rect x="44" y="332" width="252" height="38" rx="5" fill="none" stroke="#059669" stroke-width="1.5"/>
  <text x="60" y="355" fill="#6ee7b7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">SIGN</text>
  <text x="105" y="355" fill="#d1fae5" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Private key · Offline · Generate</text>

  <rect x="320" y="328" width="260" height="46" rx="6" fill="#2563eb" opacity="0.25"/>
  <rect x="324" y="332" width="252" height="38" rx="5" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="355" fill="#93c5fd" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">RUN</text>
  <text x="380" y="355" fill="#dbeafe" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">No keys · Read-only · Safe verify</text>

  <rect x="600" y="328" width="260" height="46" rx="6" fill="#d97706" opacity="0.25"/>
  <rect x="604" y="332" width="252" height="38" rx="5" fill="none" stroke="#d97706" stroke-width="1.5"/>
  <text x="620" y="355" fill="#fbbf24" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">DEPLOY</text>
  <text x="684" y="355" fill="#fef3c7" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Hub token · Write · Publish</text>

  <!-- Footer -->
  <text x="450" y="392" fill="#475569" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" text-anchor="middle">Every message is cryptographically signed, hash-chained from genesis, and verifiable in any trust zone</text>
</svg>
