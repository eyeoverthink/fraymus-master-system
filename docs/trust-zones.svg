<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <marker id="tz-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="tz-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" rx="12" fill="#1a1b2e"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1">FRAYMUS Trust Zone Architecture</text>

  <!-- ═══ SIGN Zone ═══ -->
  <rect x="30" y="60" width="220" height="240" rx="14" fill="#1e1028" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
  <rect x="42" y="72" width="196" height="30" rx="6" fill="#ef4444"/>
  <text x="140" y="93" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">SIGN ZONE</text>

  <!-- SIGN contents -->
  <rect x="52" y="115" width="176" height="36" rx="8" fill="#2d1a3e" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="138" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI,Arial,sans-serif" font-size="11">Private Key Storage</text>

  <rect x="52" y="162" width="176" height="36" rx="8" fill="#2d1a3e" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="185" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI,Arial,sans-serif" font-size="11">Identity Generation</text>

  <rect x="52" y="209" width="176" height="36" rx="8" fill="#2d1a3e" stroke="#ef4444" stroke-width="1"/>
  <text x="140" y="232" text-anchor="middle" fill="#fca5a5" font-family="Segoe UI,Arial,sans-serif" font-size="11">Message Signing</text>

  <text x="140" y="270" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">Offline · Air-gapped</text>
  <text x="140" y="284" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">No network access</text>

  <!-- ═══ RUN Zone ═══ -->
  <rect x="290" y="60" width="220" height="240" rx="14" fill="#0f1a2e" stroke="#3b82f6" stroke-width="2"/>
  <rect x="302" y="72" width="196" height="30" rx="6" fill="#3b82f6"/>
  <text x="400" y="93" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">RUN ZONE</text>

  <!-- RUN contents -->
  <rect x="312" y="115" width="176" height="36" rx="8" fill="#162236" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="138" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial,sans-serif" font-size="11">Signature Verification</text>

  <rect x="312" y="162" width="176" height="36" rx="8" fill="#162236" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="185" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial,sans-serif" font-size="11">Multi-Format Encoding</text>

  <rect x="312" y="209" width="176" height="36" rx="8" fill="#162236" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="232" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI,Arial,sans-serif" font-size="11">Hash Chain Validation</text>

  <text x="400" y="270" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">No private key · No tokens</text>
  <text x="400" y="284" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">Read-only safe execution</text>

  <!-- ═══ DEPLOY Zone ═══ -->
  <rect x="550" y="60" width="220" height="240" rx="14" fill="#0f2418" stroke="#22c55e" stroke-width="2"/>
  <rect x="562" y="72" width="196" height="30" rx="6" fill="#22c55e"/>
  <text x="660" y="93" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">DEPLOY ZONE</text>

  <!-- DEPLOY contents -->
  <rect x="572" y="115" width="176" height="36" rx="8" fill="#132a1c" stroke="#22c55e" stroke-width="1"/>
  <text x="660" y="138" text-anchor="middle" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="11">Hub Relay Comms</text>

  <rect x="572" y="162" width="176" height="36" rx="8" fill="#132a1c" stroke="#22c55e" stroke-width="1"/>
  <text x="660" y="185" text-anchor="middle" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="11">Agent Registration</text>

  <rect x="572" y="209" width="176" height="36" rx="8" fill="#132a1c" stroke="#22c55e" stroke-width="1"/>
  <text x="660" y="232" text-anchor="middle" fill="#86efac" font-family="Segoe UI,Arial,sans-serif" font-size="11">Workflow Dispatch</text>

  <text x="660" y="270" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">Hub write token · No private key</text>
  <text x="660" y="284" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-style="italic">Network write access</text>

  <!-- ═══ Arrows ═══ -->
  <!-- SIGN → RUN -->
  <line x1="250" y1="140" x2="288" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tz-arrow)"/>
  <text x="269" y="132" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">pubkey</text>

  <line x1="250" y1="185" x2="288" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tz-arrow)"/>
  <text x="269" y="177" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">signed</text>
  <text x="269" y="200" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">msgs</text>

  <!-- RUN → DEPLOY -->
  <line x1="510" y1="140" x2="548" y2="140" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tz-arrow)"/>
  <text x="529" y="132" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">verified</text>

  <line x1="510" y1="185" x2="548" y2="185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#tz-arrow)"/>
  <text x="529" y="177" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">encoded</text>
  <text x="529" y="200" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600">data</text>

  <!-- Bottom legend -->
  <text x="400" y="328" text-anchor="middle" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="10">Private keys never leave the SIGN zone · Only signatures and public data cross boundaries</text>
</svg>